# Local development stack: MongoDB (single-node replica set, needed for transactions), Redis,
# MinIO (S3 stand-in) and Mailpit (SMTP sink). Everything is bound to 127.0.0.1.
#
#   cp docker/compose.env.example .env     # fill in the values
#   docker compose up -d                   # infrastructure only
#   docker compose --profile app up --build   # plus the API container
#
# Credentials are never written here: they come from `.env` (git-ignored).

name: wab-server

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once a primary exists.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  api:
    profiles: ['app']
    build:
      context: .
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env.development
        required: false
    environment:
      NODE_ENV: development
      PORT: '3000'
      # Service names replace localhost inside the compose network.
      MONGODB_URI: mongodb://mongo:27017/wab?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

volumes:
  mongo-data:
  redis-data:
  minio-data:
