kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.applyDefaultHierarchyTemplate=true

# Coordinates (private Maven publication, see PUBLISHING.md). Nothing secret lives here.
wab.payments.group=com.wab
wab.payments.version=0.1.0

# HyperPay (OPP) mobile SDK: version and repository are owner inputs (the artifact is not on Maven Central).
wab.payments.oppwa.version=
wab.payments.oppwa.repository=

# Target registry for `publish` (GitHub Packages assumed); credentials come from the WAB_MAVEN_USER / WAB_MAVEN_TOKEN environment variables, never from the repo.
wab.payments.maven.url=

# Non-secret POM metadata.
wab.payments.scm.url=https://github.com/basimJm/WAB-Salon-System
wab.payments.scm.connection=scm:git:https://github.com/basimJm/WAB-Salon-System.git
