<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./wab-admin-kit.js"></script>
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F6F4FA}
a{color:#6D28D9;text-decoration:none}
a:hover{color:#A855F7}
input,button,select,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#9096A5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(46,158,120,.55)}70%{box-shadow:0 0 0 7px rgba(46,158,120,0)}100%{box-shadow:0 0 0 0 rgba(46,158,120,0)}}
@keyframes rowFlash{0%{background:rgba(46,158,120,.22)}100%{background:transparent}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drawerInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes drawerInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
</style>
</helmet>
<div dir="{{ dir }}" style="{{ rootStyle }}">
  <div style="display:flex;align-items:flex-start;min-height:100vh">
    <dc-import name="WAB Admin Sidebar" active="{{ navActive }}" lang="{{ lang }}" on-nav="{{ nav }}" hint-size="256px,100vh"></dc-import>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <dc-import name="WAB Admin Topbar" lang="{{ lang }}" plang="{{ plang }}" theme="{{ theme }}" hint-size="100%,64px"></dc-import>
      <main style="padding:24px 28px 56px;width:100%;max-width:1640px;box-sizing:border-box;display:flex;gap:18px;align-items:flex-start" data-screen-label="{{ screenLabel }}">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:16px">
          <dc-import name="WAB Admin Blocks" blocks="{{ blocks }}" lang="{{ lang }}" theme="{{ theme }}" state="{{ st }}" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import>
          <sc-if value="{{ upOn }}">
            <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)">
              <div style="padding:14px 18px;border-bottom:1px solid var(--line)"><div style="font-weight:700;font-size:14px">صور البانر</div><div style="font-size:11.5px;color:var(--muted)">نسخة لكل لغة · 1080×540 · JPG أو PNG حتى 2MB</div></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:18px">
                <sc-for list="{{ ups }}" as="u">
                  <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px;font-weight:600">{{ u.t }}</span><span style="{{ u.bs }}">{{ u.req }}</span></div><div style="height:150px;border-radius:12px;overflow:hidden;border:1.5px dashed var(--line2);background:var(--surface)"><image-slot id="{{ u.id }}" shape="rect" placeholder="{{ u.ph }}"></image-slot></div></div>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ rteOn }}">
            <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)">
              <div style="display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap">
                <div style="display:inline-flex;gap:3px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line)"><sc-for list="{{ rteLangs }}" as="l"><button onClick="{{ l.onClick }}" style="{{ l.s }}">{{ l.t }}</button></sc-for></div>
                <div style="width:1px;height:24px;background:var(--line2)"></div>
                <div style="display:flex;gap:4px"><sc-for list="{{ rteTools }}" as="b"><button onClick="{{ b.onClick }}" title="{{ b.title }}" style="{{ b.s }}">{{ b.t }}</button></sc-for></div>
                <div style="flex:1"></div>
                <button onClick="{{ rtePrevT }}" style="{{ rtePrevBtn }}">{{ rtePrevL }}</button>
              </div>
              <sc-if value="{{ rteEdit }}"><textarea ref="{{ rteRef }}" value="{{ rteVal }}" onChange="{{ rteChange }}" dir="{{ rteDir }}" style="width:100%;box-sizing:border-box;min-height:380px;border:none;outline:none;resize:vertical;padding:18px 22px;background:transparent;color:var(--ink);font-size:13.5px;line-height:1.9;font-family:inherit"></textarea></sc-if>
              <sc-if value="{{ rtePrev }}"><div dir="{{ rteDir }}" style="padding:18px 26px;display:flex;flex-direction:column;gap:8px;min-height:380px"><sc-for list="{{ rteLines }}" as="ln"><div style="{{ ln.s }}">{{ ln.t }}</div></sc-for></div></sc-if>
              <div style="display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap"><span style="font-size:11.5px;color:var(--muted);flex:1">{{ rteFoot }}</span><button onClick="{{ rteSave }}" style="{{ saveBtn }}">نشر التغييرات</button></div>
            </div>
          </sc-if>
        </div>
        <sc-if value="{{ phoneOn }}">
          <aside style="width:300px;flex-shrink:0;position:sticky;top:88px;display:flex;flex-direction:column;gap:10px;align-items:center">
            <span style="font-size:12px;font-weight:700;color:var(--muted)">{{ phoneTitle }}</span>
            <div style="width:280px;height:572px;border-radius:44px;background:#14172B;padding:10px;box-sizing:border-box;box-shadow:0 24px 60px rgba(20,23,43,.25)">
              <div style="{{ screenStyle }}">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:11px;font-weight:600;font-family:Poppins,sans-serif;direction:ltr;color:{{ sbColor }}"><span>2:14</span><span style="width:76px;height:22px;border-radius:12px;background:#000"></span><span>5G ▮</span></div>
                <sc-if value="{{ isPush }}">
                  <div style="padding:30px 12px 0;display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff"><span style="font-family:Poppins,sans-serif;font-size:52px;font-weight:300;line-height:1;direction:ltr">2:14</span><span style="font-size:12px;opacity:.85">الأربعاء 7 أكتوبر</span></div>
                  <div dir="{{ pushDir }}" style="margin:26px 10px 0;padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);display:flex;gap:10px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.15)">
                    <img src="assets/wab-app-icon.png" alt="" style="width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0">
                    <div style="flex:1;min-width:0;color:#1F2233"><div style="display:flex;justify-content:space-between;gap:6px"><span style="font-size:11.5px;font-weight:700;font-family:Poppins,'IBM Plex Sans Arabic',sans-serif">{{ pushApp }}</span><span style="font-size:10.5px;color:#646B7B">{{ pushWhen }}</span></div><div style="font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.4">{{ pushTitle }}</div><div style="font-size:12px;color:#3B3F50;line-height:1.5;margin-top:1px">{{ pushBody }}</div></div>
                  </div>
                </sc-if>
                <sc-if value="{{ isBanner }}">
                  <div dir="{{ bnDir }}" style="padding:8px 16px;display:flex;flex-direction:column;gap:12px">
                    <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#1F2233">WAB</span><span style="width:30px;height:30px;border-radius:10px;background:#F3EEFB"></span></div>
                    <div style="height:34px;border-radius:11px;background:#F3F1F7;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#9096A5">{{ bnSearch }}</div>
                    <div style="height:124px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#6D28D9,#A855F7)"><image-slot id="{{ bnSlot }}" shape="rect" placeholder="{{ bnPh }}"></image-slot></div>
                    <div style="display:flex;gap:5px;justify-content:center"><span style="width:16px;height:5px;border-radius:3px;background:#6D28D9"></span><span style="width:5px;height:5px;border-radius:3px;background:#DFD8EB"></span><span style="width:5px;height:5px;border-radius:3px;background:#DFD8EB"></span></div>
                    <div style="font-size:12.5px;font-weight:700;color:#1F2233">{{ bnSec }}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="height:96px;border-radius:13px;background:#F3EEFB"></div><div style="height:96px;border-radius:13px;background:#F3EEFB"></div></div>
                  </div>
                </sc-if>
              </div>
            </div>
            <span style="font-size:11px;color:var(--faint);text-align:center;max-width:260px">{{ phoneNote }}</span>
          </aside>
        </sc-if>
      </main>
    </div>
  </div>
  <dc-import name="WAB Admin Overlay" lang="{{ lang }}" theme="{{ theme }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
