<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./wab-admin-kit.js"></script>
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F6F4FA}
a{color:#6D28D9;text-decoration:none}
a:hover{color:#A855F7}
input,button,select,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#9096A5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(46,158,120,.55)}70%{box-shadow:0 0 0 7px rgba(46,158,120,0)}100%{box-shadow:0 0 0 0 rgba(46,158,120,0)}}
@keyframes rowFlash{0%{background:rgba(46,158,120,.22)}100%{background:transparent}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drawerInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes drawerInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
</style>
</helmet>
<div dir="{{ dir }}" style="{{ rootStyle }}">
  <div style="display:flex;align-items:flex-start;min-height:100vh">
    <dc-import name="WAB Admin Sidebar" active="{{ navActive }}" lang="{{ lang }}" on-nav="{{ nav }}" hint-size="256px,100vh"></dc-import>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <dc-import name="WAB Admin Topbar" lang="{{ lang }}" plang="{{ plang }}" theme="{{ theme }}" hint-size="100%,64px"></dc-import>
      <main style="padding:24px 28px 56px;width:100%;max-width:1640px;box-sizing:border-box" data-screen-label="{{ screenLabel }}">
        <dc-import name="WAB Admin Blocks" blocks="{{ blocks }}" lang="{{ lang }}" theme="{{ theme }}" state="{{ st }}" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import>
      </main>
    </div>
  </div>
  <dc-import name="WAB Admin Overlay" lang="{{ lang }}" theme="{{ theme }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
