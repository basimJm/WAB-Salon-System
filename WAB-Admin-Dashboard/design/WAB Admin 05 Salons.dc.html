<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./wab-admin-kit.js"></script>
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F6F4FA}
a{color:#6D28D9;text-decoration:none}
a:hover{color:#A855F7}
input,button,select,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#9096A5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(46,158,120,.55)}70%{box-shadow:0 0 0 7px rgba(46,158,120,0)}100%{box-shadow:0 0 0 0 rgba(46,158,120,0)}}
@keyframes rowFlash{0%{background:rgba(46,158,120,.22)}100%{background:transparent}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drawerInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes drawerInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
</style>
</helmet>
<div dir="{{ dir }}" style="{{ rootStyle }}">
  <div style="display:flex;align-items:flex-start;min-height:100vh">
    <dc-import name="WAB Admin Sidebar" active="{{ navActive }}" lang="{{ lang }}" on-nav="{{ nav }}" hint-size="256px,100vh"></dc-import>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <dc-import name="WAB Admin Topbar" lang="{{ lang }}" plang="{{ plang }}" theme="{{ theme }}" hint-size="100%,64px"></dc-import>
      <main style="padding:24px 28px 56px;width:100%;max-width:1640px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px" data-screen-label="{{ screenLabel }}">
        <dc-import name="WAB Admin Blocks" blocks="{{ blocks }}" lang="{{ lang }}" theme="{{ theme }}" state="{{ st }}" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import>
        <sc-if value="{{ docOn }}">
          <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden">
            <div style="display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap">
              <div style="flex:1;min-width:200px"><div style="font-weight:700;font-size:14px">عارض الوثائق</div><div style="font-size:11.5px;color:var(--muted)">{{ docName }} · رابط موقّع صالح لمدة 10 دقائق</div></div>
              <div style="display:flex;gap:6px;align-items:center">
                <button onClick="{{ zoomOut }}" title="تصغير" style="{{ ib }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4M8 11h6"></path></svg></button>
                <span style="min-width:48px;text-align:center;font-family:Poppins,sans-serif;font-size:12px;font-weight:600">{{ zoomT }}</span>
                <button onClick="{{ zoomIn }}" title="تكبير" style="{{ ib }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4M8 11h6M11 8v6"></path></svg></button>
                <button onClick="{{ rotate }}" title="تدوير" style="{{ ib }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"></path></svg></button>
                <button onClick="{{ download }}" style="{{ dlb }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg>تنزيل</button>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:150px minmax(0,1fr);min-height:520px">
              <div style="border-inline-end:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)">
                <sc-for list="{{ thumbs }}" as="t">
                  <button onClick="{{ t.onClick }}" style="{{ t.style }}"><div style="height:120px;width:100%;border-radius:7px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"></path></svg></div><span style="font-size:11.5px;font-weight:600;line-height:1.4">{{ t.n }}</span><span style="font-size:10.5px;color:var(--muted);font-family:Poppins,sans-serif">{{ t.meta }}</span></button>
                </sc-for>
              </div>
              <div style="position:relative;overflow:auto;background:repeating-conic-gradient(var(--surface) 0 25%,var(--card) 0 50%) 0 0/22px 22px;display:flex;align-items:center;justify-content:center;padding:30px">
                <div style="{{ pageStyle }}">
                  <image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotPh }}"></image-slot>
                </div>
              </div>
            </div>
          </div>
        </sc-if>
      </main>
    </div>
  </div>
  <dc-import name="WAB Admin Overlay" lang="{{ lang }}" theme="{{ theme }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
