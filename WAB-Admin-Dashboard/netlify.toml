# Netlify: set "Base directory" to WAB-Admin-Dashboard in the site settings.
# Production needs the public values VITE_API_BASE_URL and VITE_SOCKET_URL (https) in the site's environment variables;
# add CSP_CONNECT_EXTRA (comma list) for the storage host presigned uploads go to.
# Previews and branch deploys build the dev variant with the mock data source: no API needed.

[build]
  command = "npm ci && npm run build:prod-release && node scripts/write-hosting.ts prod-release"
  publish = "dist/prod-release"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm ci && npm run build:dev-release && node scripts/write-hosting.ts dev-release"
  publish = "dist/dev-release"

[context.branch-deploy]
  command = "npm ci && npm run build:dev-release && node scripts/write-hosting.ts dev-release"
  publish = "dist/dev-release"
