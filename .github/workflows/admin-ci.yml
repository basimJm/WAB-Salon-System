# WAB-Admin-Dashboard CI. Runs on every PR (task branches target `admin`) and on pushes to `admin`/`main`
# when the admin panel (or this workflow) changes. One job: install, verify (types, lint, format, unit tests,
# hardcoded + 300-line scan) and build all four variants. A PR merges into `admin` only when this is green.
name: Admin CI

on:
  pull_request:
    paths:
      - "WAB-Admin-Dashboard/**"
      - ".github/workflows/admin-ci.yml"
  push:
    branches: [main, admin]
    paths:
      - "WAB-Admin-Dashboard/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: WAB-Admin-Dashboard

env:
  # Build-validation values only (reserved .invalid TLD): real URLs are never needed to compile.
  VITE_API_BASE_URL: https://api.ci.invalid
  VITE_SOCKET_URL: https://socket.ci.invalid

jobs:
  build:
    name: Admin build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WAB-Admin-Dashboard/package-lock.json
      - run: npm ci
      - name: Verify (types, lint, format, tests, hardcoded scan)
        run: npm run verify
      - name: Build dev-debug
        run: npm run build:dev-debug
      - name: Build dev-release
        run: npm run build:dev-release
      - name: Build prod-debug
        run: npm run build:prod-debug
      - name: Build prod-release
        run: npm run build:prod-release
