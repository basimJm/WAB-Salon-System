# WAB-Server CI (SRV-010). Runs only when the server (or this workflow) changes.
name: Server CI

on:
  pull_request:
    paths:
      - "WAB-Server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    paths:
      - "WAB-Server/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: WAB-Server

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WAB-Server/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # Includes the stale-Swagger/Postman check (tests/docs.test.ts, CLAUDE.md §11).
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Production dependencies only: dev-only advisories (test tooling) do not ship.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lists the pull request's commits to scan only the new ones.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
