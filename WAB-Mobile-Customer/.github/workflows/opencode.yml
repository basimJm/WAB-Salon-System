name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: opencode-ai/opencode-action@v1
        with:
          model: opencode/zen
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
