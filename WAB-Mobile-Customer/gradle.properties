#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx8g
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#App version (CI may override with -P)
APP_VERSION_NAME=1.0
APP_VERSION_CODE=1

#Environments (PLACEHOLDER hosts until the platform domain is decided; override locally in local.properties)
DEV_API_BASE_URL=https://dev-api.template.app
DEV_WEB_BASE_URL=https://dev.template.app
PROD_API_BASE_URL=https://api.template.app
PROD_WEB_BASE_URL=https://template.app
#Optional: install dev next to prod (needs a matching Firebase app in google-services.json)
DEV_APPLICATION_ID_SUFFIX=
# Data source per flavor: fixtures (mock) or the real API (remote); prod must stay remote (INTEGRATION.md §4).
DEV_DATA_SOURCE=remote
PROD_DATA_SOURCE=remote
PROD_APPLICATION_ID_SUFFIX=
# Merchant app hand-off (PRD S21 "Register your salon"): deep link, Play listing and package of the merchant app.
# PLACEHOLDERS until the merchant app ships; empty values fall back to the website registration page.
DEV_MERCHANT_REGISTER_URL=https://merchant-dev.template.app/register
DEV_MERCHANT_STORE_URL=https://play.google.com/store/apps/details?id=com.fab.wab.merchant
DEV_MERCHANT_APP_ID=com.fab.wab.merchant
PROD_MERCHANT_REGISTER_URL=https://merchant.template.app/register
PROD_MERCHANT_STORE_URL=https://play.google.com/store/apps/details?id=com.fab.wab.merchant
PROD_MERCHANT_APP_ID=com.fab.wab.merchant

org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.daemon=true