<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#ECE9F5;font-family:'Poppins',sans-serif}
  ::selection{background:#D8B4FE}
  a{color:#6D28D9;text-decoration:none}
  a:hover{color:#A855F7}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="390,844">
  <div style="{{ screenStyle }}">

    <sc-if value="{{ screen === 'location' }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;animation:fadeUp .5s ease both">
        <div style="width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.25),transparent 70%);display:flex;align-items:center;justify-content:center;margin-bottom:28px;animation:popIn .5s ease both">
          <span style="font-size:52px">📍</span>
        </div>
        <div style="font-family:'Playfair Display',serif;font-weight:600;font-size:22px;color:#F8FAFC;text-align:center;margin-bottom:10px">Find salons near you</div>
        <div style="font-size:13.5px;color:#9CA3AF;text-align:center;line-height:1.6;margin-bottom:36px">Allow location access so we can show the closest salons and stylists in your area.</div>

        <button onclick="{{ onAllowLocation }}" style="{{ primaryBtnStyle }}">Allow location access</button>
        <button onclick="{{ onSkipLocation }}" style="{{ secondaryBtnStyle }}">Not now</button>
      </div>
    </sc-if>

    <sc-if value="{{ screen === 'notifications' }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;animation:fadeUp .5s ease both">
        <div style="width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.25),transparent 70%);display:flex;align-items:center;justify-content:center;margin-bottom:28px;animation:popIn .5s ease both">
          <span style="font-size:52px">🔔</span>
        </div>
        <div style="font-family:'Playfair Display',serif;font-weight:600;font-size:22px;color:#F8FAFC;text-align:center;margin-bottom:10px">Stay in the loop</div>
        <div style="font-size:13.5px;color:#9CA3AF;text-align:center;line-height:1.6;margin-bottom:36px">Get notified about booking confirmations, reminders, and special offers from your favorite salons.</div>

        <button onclick="{{ onAllowNotif }}" style="{{ primaryBtnStyle }}">Allow notifications</button>
        <button onclick="{{ onSkipNotif }}" style="{{ secondaryBtnStyle }}">Not now</button>
      </div>
    </sc-if>

    <div style="display:flex;justify-content:center;gap:8px;padding-bottom:28px">
      <div style="{{ dot1Style }}"></div>
      <div style="{{ dot2Style }}"></div>
    </div>
  </div>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { screen: 'location' };

  onAllowLocation = () => this.setState({ screen: 'notifications' });
  onSkipLocation = () => this.setState({ screen: 'notifications' });
  onAllowNotif = () => { window.location.href = 'Home Screen.dc.html'; };
  onSkipNotif = () => { window.location.href = 'Home Screen.dc.html'; };

  renderVals() {
    const s = this.state;
    const dot = (active) => ({
      width: active ? '20px' : '8px', height: '8px', borderRadius: '4px',
      background: active ? '#A855F7' : 'rgba(255,255,255,.2)', transition: 'all .25s ease',
    });
    return {
      screen: s.screen,
      onAllowLocation: this.onAllowLocation,
      onSkipLocation: this.onSkipLocation,
      onAllowNotif: this.onAllowNotif,
      onSkipNotif: this.onSkipNotif,
      dot1Style: dot(s.screen === 'location'),
      dot2Style: dot(s.screen === 'notifications'),
      screenStyle: {
        display: 'flex', flexDirection: 'column', height: '100%',
        paddingTop: '58px', boxSizing: 'border-box',
        background: 'linear-gradient(160deg,#14172B 0%,#1B1030 55%,#2A1450 100%)',
      },
      primaryBtnStyle: {
        width: '100%', padding: '15px', borderRadius: '14px', border: 'none',
        background: 'linear-gradient(135deg,#6D28D9,#A855F7)', color: '#fff',
        fontSize: '15px', fontWeight: 600, fontFamily: "'Poppins',sans-serif",
        cursor: 'pointer', boxShadow: '0 10px 28px rgba(109,40,217,.4)', marginBottom: '12px',
      },
      secondaryBtnStyle: {
        width: '100%', padding: '15px', borderRadius: '14px', border: 'none',
        background: 'transparent', color: '#9CA3AF',
        fontSize: '14px', fontWeight: 500, fontFamily: "'Poppins',sans-serif", cursor: 'pointer',
      },
    };
  }
}
</script>
</body>
</html>
