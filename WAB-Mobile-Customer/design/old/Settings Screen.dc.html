<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#fff;font-family:'Poppins',sans-serif}a{color:#6D28D9;text-decoration:none}</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="390,844">
  <div style="{{ screenStyle }}">
    <div style="padding:0 20px 20px;font-family:'Playfair Display',serif;font-weight:600;font-size:19px;color:#1F2233">Settings</div>

    <div style="flex:1;overflow-y:auto">
      <div style="display:flex;align-items:center;gap:14px;padding:0 20px 22px">
        <div style="width:58px;height:58px;border-radius:50%;overflow:hidden;flex-shrink:0">
          <image-slot id="settings-avatar" shape="circle" placeholder="Photo"></image-slot>
        </div>
        <div>
          <div style="font-size:15px;font-weight:600;color:#1F2233">Layla Haddad</div>
          <div style="font-size:12.5px;color:#9CA3AF">+962 7X XXX XXXX</div>
        </div>
      </div>

      <sc-for list="{{ groups }}" as="group" hint-placeholder-count="3">
        <div style="padding:0 20px 8px;font-size:11.5px;font-weight:600;color:#9CA3AF;letter-spacing:.5px;text-transform:uppercase">{{ group.title }}</div>
        <div style="padding:0 20px 20px">
          <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F0EEF5">
              <div style="display:flex;align-items:center;gap:12px">
                <div style="width:34px;height:34px;border-radius:10px;background:#F3EEFB;display:flex;align-items:center;justify-content:center;font-size:16px">{{ item.icon }}</div>
                <div style="font-size:13.5px;color:#1F2233">{{ item.label }}</div>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C4CC" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </div>
          </sc-for>
        </div>
      </sc-for>

      <div style="padding:0 20px 30px">
        <button style="width:100%;padding:14px;border-radius:14px;border:1px solid #F4C7C7;background:#FFF6F6;color:#DC2626;font-size:13.5px;font-weight:600;cursor:pointer">Log out</button>
      </div>
    </div>

    <div style="display:flex;padding:10px 0 22px;border-top:1px solid #F0EEF5;background:#fff">
      <a href="Home Screen.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9CA3AF">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.7"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
        <div style="font-size:10.5px">Home</div>
      </a>
      <a href="My Bookings Screen.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9CA3AF">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.7"><rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 9.5h16M8 3.5v3.5M16 3.5v3.5"/></svg>
        <div style="font-size:10.5px">Booking</div>
      </a>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#6D28D9">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.9"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4"/></svg>
        <div style="font-size:10.5px;font-weight:600">Settings</div>
      </div>
    </div>
  </div>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { title: 'Account', items: [
          { icon: '👤', label: 'Edit profile' },
          { icon: '📍', label: 'Saved addresses' },
          { icon: '💳', label: 'Payment methods' },
        ]},
        { title: 'Preferences', items: [
          { icon: '🔔', label: 'Notifications' },
          { icon: '🌐', label: 'Language' },
        ]},
        { title: 'Support', items: [
          { icon: '❓', label: 'Help center' },
          { icon: '📄', label: 'Terms & Privacy Policy' },
        ]},
      ],
      screenStyle: {
        display: 'flex', flexDirection: 'column', height: '100%',
        paddingTop: '58px', boxSizing: 'border-box', background: '#fff', color: '#1F2233',
      },
    };
  }
}
</script>
</body>
</html>
